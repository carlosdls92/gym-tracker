name: Despliegue Automatico OMVDLS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, omv]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy en CasaOS
        run: |
          mkdir -p /var/lib/casaos/apps/gym-tracker
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            . /var/lib/casaos/apps/gym-tracker/
          cd /var/lib/casaos/apps/gym-tracker
          docker compose down --remove-orphans || true
          docker compose build --no-cache
          docker compose up -d

      - name: Health check
        run: |
          echo "Esperando que la app arranque (primera vez descarga GIFs)..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8095/ > /dev/null; then
              echo "gym-tracker OK en :8095 (intento $i)"
              exit 0
            fi
            echo "  intento $i/40 — esperando 5s..."
            sleep 5
          done
          echo "Health check fallido"
          exit 1
