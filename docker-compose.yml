services:
  gym-tracker:
    build: .
    container_name: gym-tracker
    # host network: mongo corre en host:27017 (replica set); igual que el resto de apps DLS.
    network_mode: host
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://localhost:27017/gym_tracker}
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64
    - arm64
  main: gym-tracker
  author: carlosdls92
  developer: carlosdls92
  category: Health
  icon: http://192.168.0.23:8082/static/logo.jpg
  title:
    en_us: "Gym Tracker"
    es_es: "Gym Tracker"
  tagline:
    en_us: "Workout plan tracker with offline HTML export"
    es_es: "Seguimiento de planes de gimnasio con exportacion HTML offline"
  description:
    en_us: "FastAPI app to track workout plans with exercise GIFs, progress tracking, and offline HTML export."
    es_es: "App FastAPI para seguir planes de gimnasio con GIFs de ejercicios, progreso y exportacion HTML offline."
  index: /
  port_map: "8082"
  scheme: http
  store_app_id: gym-tracker
